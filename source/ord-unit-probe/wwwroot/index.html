px;font-variant-numeric:tabular-nums}.unit-label{overflow:hidden;text-overflow:ellipsis}.unit-row.owned .quantity{color:#6550a7;border-color:#baafe0}.recipe-button{display:grid;place-items:center;width:14px;height:18px;padding:0;border:0;background:#a1cbb1;color:#fff;font-size:12px;line-height:16px}.recipe-button.ready{background:#68b186}.recipe-button:disabled{color:#d7d3df;background:#f1eef8}.quantity{display:grid;place-items:center;width:16px;height:18px;border:1px solid #d9d4e7;background:#fff;color:#655e80;text-align:center;font-size:9px;font-variant-numeric:tabular-nums;overflow:hidden}.board.checking .unit-row{opacity:.72}.empty-board{padding:60px 20px;text-align:center;color:#8c829f}.flash-up .quantity{animation:flash-up 1.1s ease-out}.flash-down .quantity{animation:flash-down 1.1s ease-out}@keyframes flash-up{0%,20%{background:#a8e6bd}100%{background:#fff}}@keyframes flash-down{0%,20%{background:#f5bec5}100%{background:#fff}}

dialog{width:min(680px,calc(100vw - 24px));max-height:92vh;padding:0;border:0;border-radius:3px;overflow:hidden;background:#fff;color:#494d58;box-shadow:0 12px 70px #0004}dialog::backdrop{background:#27243580}.detail-topbar{display:flex;align-items:center;justify-content:space-between;height:29px;padding:4px 10px}.detail-nav,.close-detail{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;background:none;color:#616575;font-size:20px}.detail-nav:disabled{color:#bdc0c8}.detail-header{display:flex;align-items:center;gap:10px;margin:0 10px;padding:8px 0 15px;border-bottom:1px solid var(--line)}.detail-header .unit-icon{width:30px;height:30px}.detail-title{min-width:0;flex:1}#detail-name{margin:0;font-size:13px;font-weight:600;line-height:1.65;overflow-wrap:anywhere}#detail-tier{display:none}.detail-abilities{max-width:180px;padding:8px 10px;border-radius:10px;background:#f8f9fc;color:#646b78;font-size:9px;line-height:1.5;white-space:pre-line}.detail-content{max-height:calc(92vh - 110px);overflow-y:auto;padding:0 10px 12px}.detail-top{display:flex;justify-content:space-between;gap:12px;margin:9px 0;font-size:10px;color:#9591a0}.detail-choice{margin:0 0 9px;color:#8b6671;font-size:10px}#recipe-options{width:100%;padding:5px 7px;margin:0 0 8px;border:1px solid #ddd8eb;background:#fff;color:#615571}.recipe-section{padding:15px 0 12px;border-bottom:1px solid var(--line)}.recipe-section-title{margin:0 0 12px;font-size:13px;font-weight:600;color:#484d58}.material-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:13px 12px;align-items:start}.material-card{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:0 2px;border:0;background:transparent;color:#747984;text-align:center;cursor:pointer}.material-card .unit-icon{width:30px;height:30px}.material-card:hover .material-caption{color:#6750b5;text-decoration:underline;text-underline-offset:2px}.material-caption{width:100%;font-size:8px;line-height:1.5;overflow-wrap:anywhere}.material-percent{font-size:10px;color:#8d929e;font-variant-numeric:tabular-nums}.section-empty{margin:0;color:#a5a5ad;font-size:10px}.extra-condition{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0;color:#8b8595;font-size:10px}.recipe-note{margin:9px 0;font-size:10px;line-height:1.6;color:#9d8b8f}.craft-action{display:block;min-width:150px;margin:15px 0 2px auto;padding:8px 12px;border:0;border-radius:3px;background:var(--purple);color:#fff}.craft-action:disabled{background:#e7e2f2;color:#a59bb8}
#toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);z-index:100;padding:9px 13px;border:1px solid #dfd8ed;border-radius:4px;background:#fff;box-shadow:0 4px 24px #0002;color:#655a77;font-size:11px}[hidden]{display:none!important}@media(max-width:1000px){.toolbar{align-items:flex-start}.brand{flex-direction:column;gap:3px}.tier-filters{grid-template-columns:repeat(4,minmax(100px,1fr))}.tools{gap:5px}}@media(max-width:600px){.toolbar{position:relative;flex-direction:column;align-items:stretch}.brand{flex-direction:row}.tools{justify-content:flex-start}.tier-filters{grid-template-columns:repeat(3,minmax(86px,1fr))}.detail-abilities{max-width:145px}.detail-header{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.flash-up .quantity,.flash-down .quantity{animation:none}}
.detail-header{flex-wrap:wrap}.detail-title{flex:1 1 180px}.detail-summary{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:8px;max-width:100%;margin-left:auto;position:relative}.detail-story{position:static}.story-rank{display:inline-block;padding:8px 9px;border:0;border-radius:10px;background:#f1eefb;color:#65549a;font-size:9px;line-height:1.5;white-space:nowrap}

<body><header class="toolbar"><div class="brand"><h1>원랜디 조합도우미</h1><span id="map-caption">유닛 정보 불러오는 중</span></div><div class="tools"><div class="live-state" id="live-state" data-tone="waiting" role="status"><span class="state-dot" aria-hidden="true"></span><span id="status-text">게임에 연결 중</span></div><span id="owned-total"></span><input id="search" class="search" type="search" placeholder="유닛 검색" aria-label="유닛 검색" autocomplete="off"><select id="sort" class="sort" aria-label="유닛 정렬"><option value="default">기본순</option><option value="owned">보유순</option><option value="name">이름순</option><option value="ready">재료 충족순</option></select><button id="fullscreen" class="tool-button" type="button">전체화면</button></div></header>
<section id="nightmare-advisor-host"></section>
<details class="filters"><summary>유닛 필터</summary><div class="filter-content"><div class="filter-main"><label><input id="owned-only" type="checkbox">보유 유닛만</label><label><input id="materials-only" type="checkbox">유닛 재료 충족</label><span id="last-updated"></span><span id="craft-availability">게임 조합 준비 중</span><button id="filter-clear" type="button">필터 초기화</button></div><div class="tier-filters" id="tier-filters"></div></div></details>
<div class="state-banner" id="state-banner" data-tone="waiting">게임에 연결 중</div><div class="craft-feedback" id="craft-feedback" role="status" hidden></div><main class="board-scroll"><div class="board" id="board"></div><div id="catalog-state" class="empty-board">유닛 정보를 불러오는 중</div></main>
<dialog id="unit-detail" aria-labelledby="detail-name"><div class="detail-topbar"><button id="detail-back" class="detail-nav" type="button" aria-label="이전 유닛">←</button><button class="close-detail" id="close-detail" type="button" aria-label="닫기">×</button></div><div class="detail-header"><div id="detail-icon"></div><div class="detail-title"><h2 id="detail-name"></h2><div id="detail-tier"></div></div><div class="detail-summary"><span id="detail-story" class="detail-story" hidden><span id="detail-story-rank" class="story-rank"></span></span><div class="detail-abilities" id="detail-abilities" hidden></div></div></div><div class="detail-content"><div class="detail-top"><span id="detail-mode"></span><span id="detail-quantity"></span></div><div id="detail-choice" class="detail-choice" hidden></div><select id="recipe-options" aria-label="조합법" hidden></select><div id="recipe-detail"></div></div></dialog><div id="toast" role="status" hidden></div>
<script src="/recipe-graph.js"></script><script src="/starting-evolution-forecast.js"></script><script src="/nightmare-reward-budget.js"></script><script src="/nightmare-random-forecast.js"></script><script src="/nightmare-strategy-panel.js"></script><script src="/nightmare-advisor-integration.js"></script><script>
"use strict";
const byId=id=>document.getElementById(id);
const numberFormat=new Intl.NumberFormat("ko-KR");
const materialItemNames=Object.freeze({AI00:"우타의 헤드셋",AI01:"태양신의 흔적",AI02:"불사조의 깃털"});
const canonicalTiers = [
  {id:"common",label:"흔함",column:0}, {id:"uncommon",label:"안흔함",column:0},
  {id:"special",label:"특별함",column:1}, {id:"rare",label:"희귀함",column:2},
  {id:"legendary",label:"전설",column:3}, {id:"hidden",label:"히든",column:4},
  {id:"limited",label:"제한",column:4}, {id:"transcendent",label:"초월",column:5},
  {id:"immortal",label:"불멸",column:6}, {id:"eternal",label:"영원",column:6},
  {id:"changed",label:"변화된",column:7}, {id:"random",label:"랜덤 유닛",column:7},
  {id:"mystery",label:"신비",column:7}, {id:"distorted",label:"왜곡",column:7},
  {id:"specialunit",label:"특수",column:7}, {id:"seraphim",label:"세라핌",column:7},
  {id:"other",label:"기타",column:0}
];
const tierSettings = new Map(canonicalTiers.map(tier => [tier.id,tier]));
const tierAliases = {
  common:"common",normal:"common",uncommon:"uncommon",special:"special",rare:"rare",
  legendary:"legendary",legend:"legendary",hidden:"hidden",limited:"limited",limit:"limited",
  transcendent:"transcendent",transcendence:"transcendent",transcend:"transcendent",
  immortal:"immortal",eternal:"eternal",changed:"changed",change:"changed",random:"random",
  other:"other",wisp:"other"
};

const unstableStatuses=new Set(["units_changed","world_changed","partial_read"]);
const unitByCode=new Map(),unitsByTier=new Map(),recipesByUnit=new Map(),rows=new Map(),sections=new Map();
const hiddenTiers=new Set(),collapsedTiers=new Set(),flashTimers=new Map();
let catalog=null,catalogError=false,liveCounts=null,mode="live",combatMetadata=null,nativeUnitDescriptions=null,recipeGraph=null;
let storyRankings=null;
let startingEvolutionForecast=null;
let liveState={message:"게임에 연결 중",tone:"waiting",checking:false},receivedRevision=0,latestSnapshot=null;
let detailUnit=null,selectedRecipe=null,selectedMaterialChoiceRawcode=null,toastTimer=null,crafting=null,liveReceivedAt=0;
let craftMessage="",craftTone="";
let craftCapabilities={enabled:false,supportedRecipeIds:new Set(),unsupportedRecipes:new Map(),token:null,continuousCraftSupported:false,choiceWispSupported:false,protectedCountsSupported:false,exactPlanSupported:false,itemRequirementsSupported:false,readableItemRawcodes:new Set(),recipeConditionsSupported:false,specialRecipeConditionsSupported:false,readableConditionTypes:new Set()};
let craftCapabilityRevision=0,executionPlanCache=new Map();
let detailStack=[],boardGroups=[],analysisSignature="",analysisCache=new Map(),lastDetailKey="";
const nightmareIntegration=(()=>{try{return window.OrdNightmareIntegration?.create({
  host:byId("nightmare-advisor-host"),onOpenUnit:code=>openDetail(code),onCraftTarget:requestRecommendedCraft,onStopCraft:requestCraftStop,
  onCraftContextChange:()=>{if(detailUnit){lastDetailKey="";renderDetail();}},
  onShowRecipe:(code,recipeId)=>{
    if(!unitByCode.has(code))return;
    openDetail(code);
    if(recipeId&&(recipesByUnit.get(code)||[]).some(recipe=>String(recipe.id)===String(recipeId))){
      selectedRecipe=String(recipeId);lastDetailKey="";renderDetail();
    }
  }
})||null;}catch{byId("nightmare-advisor-host").textContent="추천 정보를 불러오지 못했어요. 페이지를 새로고침해 주세요.";return null;}})();
function updateNightmareAdvisor(){
  nightmareIntegration?.update({catalog,counts:liveCounts,snapshot:latestSnapshot,liveState,
    capabilities:craftCapabilities,receivedAt:liveReceivedAt,craftRunning:Boolean(crafting),activeCraftTarget:crafting?.resultRawcode||null,activeCraftExpectedResults:crafting?.expectedResults||[],craftStopRequested:Boolean(crafting?.stopRequested),craftMessage,craftTone});
}
function requestRecommendedCraft(rawcode,target){
  if(crafting||!liveCounts||!craftCapabilities.protectedCountsSupported||!craftCapabilities.exactPlanSupported)return;
  if(target?.rawcode!==rawcode||!target.protectedCounts||!Array.isArray(target.expectedSteps)||!target.expectedSteps.length||target.expectedSteps.length>64)return;
  const expectedSteps=target.expectedSteps;
  const last=expectedSteps.at(-1);
  const plan={executable:true,steps:expectedSteps,stepCount:expectedSteps.length,usesChoiceWisps:expectedSteps.some(step=>step.type==="choice"),resourceCost:{wood:target.wood,gold:target.gold},nonUnitRequirements:target.nonUnitRequirements||[],itemRequirements:target.itemRequirements||[],conditionRequirements:target.conditionRequirements||[]};
  const recipe=last?.type==="craft"?(recipesByUnit.get(rawcode)||[]).find(item=>String(item.id)===String(last.recipeId)):null;
  if(!recipe){craftFeedback("지금은 조합할 수 없어요.","error");updateNightmareAdvisor();return;}
  return requestGameCraft(recipe,{plan,protectedCounts:target.protectedCounts,expectedSteps});
}

function normalizeTier(value) {
  const text = String(value || "").trim().toLowerCase().replace(/[\s_-]/g,"");
  if (tierAliases[text]) return tierAliases[text];
  if (/안흔|고급/.test(text)) return "uncommon";
  if (/흔함|일반/.test(text)) return "common";
  if (/특별/.test(text)) return "special";
  if (/희귀/.test(text)) return "rare";
  if (/전설/.test(text)) return "legendary";
  if (/히든|숨겨/.test(text)) return "hidden";
  if (/초월/.test(text)) return "transcendent";
  if (/불멸/.test(text)) return "immortal";
  if (/영원/.test(text)) return "eternal";
  if (/제한|한정/.test(text)) return "limited";
  if (/변화|변이/.test(text)) return "changed";
  if (/랜덤|무작위/.test(text)) return "random";
  if (/신비/.test(text)) return "mystery";
  if (/왜곡/.test(text)) return "distorted";
  if (/특수/.test(text)) return "specialunit";
  if (/세라핌/.test(text)) return "seraphim";
  return "other";
}

function cleanName(value) {
  return String(value || "").replace(/\|c[0-9a-f]{8}/gi,"").replace(/\|r/gi,"").replace(/\|n/gi," ").trim();
}

function normalizeStoryRankings(data,currentCatalog){
  if(data?.schemaVersion!==1||!currentCatalog?.map?.sha256||data.catalogMapHash!==currentCatalog.map.sha256||!Array.isArray(data.entries)||!data.entries.length||data.entries.length>512)return null;
  if(data.measurementVersion!==null&&!/^\d+\.\d+$/.test(data.measurementVersion||""))return null;
  const conditions=data.conditions;
  if(conditions?.difficulty!=="악몽"||conditions.story!=="마린포드"||conditions.durationSeconds!==60||conditions.startingHealthPercent!==100||conditions.buffPolicy!=="cooldown"||conditions.holdControl!==false)return null;
  const known=new Map(currentCatalog.units.map(unit=>[unit.rawcode,unit])),entries=new Map(),ranks=new Set();
  for(const entry of data.entries){
    const unit=known.get(entry?.rawcode),metric=entry?.metric,value=entry?.value;
    if(!unit||unit.playable!==true||cleanName(unit.displayName||unit.properName||unit.name)!==entry.catalogName||normalizeTier(unit.tier)!==normalizeTier(entry.tier)||entries.has(entry.rawcode)||!Number.isSafeInteger(entry.rank)||entry.rank<1||entry.rank>data.entries.length||ranks.has(entry.rank))return null;
    if(!Number.isFinite(value)||value<=0||!(metric==="completion_seconds"&&value<=60||metric==="damage_percent"&&value<=100))return null;
    entries.set(entry.rawcode,{...entry});ranks.add(entry.rank);
  }
  return {measurementVersion:data.measurementVersion,sourceExperimentVersion:data.sourceExperimentVersion,entries};
}
function renderStoryRank(unit){
  const host=byId("detail-story"),label=byId("detail-story-rank"),entry=storyRankings?.entries.get(unit.rawcode);
  host.hidden=!entry;label.textContent="";if(!entry)return;
  label.textContent="스토리 "+entry.rank+"위";
}
async function loadStoryRankings(){
  try{
    const response=await fetch("/data/nightmare-story-rankings.json",{cache:"no-store",signal:AbortSignal.timeout(4000)});
    if(!response.ok)return;storyRankings=normalizeStoryRankings(await response.json(),catalog);
    if(detailUnit){lastDetailKey="";renderDetail();}
  }catch{storyRankings=null;}
}

function nameOf(code) {
  return unitByCode.get(code)?.displayName || (code === "e0IX" ? "랜덤 위습" : "이름 없는 유닛");
}

function makeElement(tag,className,text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function makeIcon(unit) {
  const icon = makeElement("span","unit-icon");
  icon.setAttribute("aria-hidden","true");

function applySnapshot(payload) {

  latestSnapshot = payload;
  const status = payload.status;
  if (status === "game_not_running") return setLiveState("게임을 실행해 주세요","waiting",false,true);
  if (status === "multiple_games") return setLiveState("게임을 하나만 실행해 주세요","checking",false,true);
  if (status === "unsupported_game_version") return setLiveState("이 버전은 지원하지 않아요","error",false,true);
  if (["unsupported_map","catalog_mismatch","map_mismatch"].includes(status)) return setLiveState("현재 맵은 지원하지 않아요","error",false,true);
  if (["connecting","game_module_not_ready","world_not_ready","waiting","starting"].includes(status)) return setLiveState("게임에 연결 중","waiting",false,true);
  if (unstableStatuses.has(status)) return setLiveState("수량 확인 중","checking",true,false);
  if (status !== "snapshot_read") return setLiveState("수량을 불러오지 못했어요","error",false,true);
  if (payload.catalogMatchesLoadedArchive === false) return setLiveState("현재 맵은 지원하지 않아요","error",false,true);
  if (payload.catalogMatchesLoadedArchive !== true) return setLiveState("게임에 연결 중","waiting",false,true);
  if (catalog?.map?.sha256 && payload.loadedMapHash && catalog.map.sha256.toLowerCase() !== String(payload.loadedMapHash).toLowerCase()) return setLiveState("현재 맵은 지원하지 않아요","error",false,true);
  if (payload.stableUnits === false || Number(payload.readErrors) > 0) return setLiveState("수량 확인 중","checking",true,false);
  if (!Array.isArray(payload.counts)) return setLiveState("수량을 불러오지 못했어요","error",false,true);
  const counts = new Map();
  for (const unit of payload.counts) {

    if(crafting?.requestId===requestId){crafting.stopRequested=false;craftFeedback("중지 요청을 보내지 못했습니다. 다시 눌러 주세요.","error");}
  }
}

async function refreshCraftCapabilities() {
  try {
    const response = await fetch("/api/craft/capabilities",{cache:"no-store",signal:AbortSignal.timeout(2000)});
    if (!response.ok) throw new Error("capabilities unavailable");
    const data = await response.json();
    craftCapabilities = {
      enabled:data.enabled === true,
      supportedRecipeIds:new Set(Array.isArray(data.supportedRecipeIds) ? data.supportedRecipeIds.map(String) : []),
      unsupportedRecipes:new Map((Array.isArray(data.unsupportedRecipes)?data.unsupportedRecipes:[]).filter(item=>typeof item?.recipeId==="string"&&/^[A-Za-z0-9]{4}$/.test(item.recipeId)&&["unsupported_recipe_requirements","targeted_input_required","unverified_input_method"].includes(item.reason)&&typeof item.message==="string"&&item.message.length<=100&&/[가-힣]/.test(item.message)&&!/[\r\n]|[A-Za-z]:[\\/]|stacktrace|\bat \w+[.(]/i.test(item.message)).map(item=>[item.recipeId,{reason:item.reason,message:item.message}])),
      token:typeof data.token === "string" && data.token.trim() ? data.token : null,
      continuousCraftSupported:data.continuousCraftSupported===true,
      adaptiveCraftSupported:data.adaptiveCraftSupported===true,
      stopCraftSupported:data.stopCraftSupported===true,
      choiceWispSupported:data.choiceWispSupported===true,
      protectedCountsSupported:data.protectedCountsSupported===true,
      itemRequirementsSupported:data.itemRequirementsSupported===true,
      readableItemRawcodes:new Set(Array.isArray(data.readableItemRawcodes)?data.readableItemRawcodes.filter(code=>Object.hasOwn(materialItemNames,code)):[]),
      recipeConditionsSupported:data.recipeConditionsSupported===true,
      specialRecipeConditionsSupported:data.specialRecipeConditionsSupported===true,
      readableConditionTypes:new Set(Array.isArray(data.readableConditionTypes)?data.readableConditionTypes.filter(type=>["UBAN","KING"].includes(type)||data.specialRecipeConditionsSupported===true&&["IFCT","CHCT","SKPT","RMAX","NIKA"].includes(type)):[]),
      exactPlanSupported:data.exactPlanSupported===true
    };
  } catch {
    craftCapabilities = {enabled:false,supportedRecipeIds:new Set(),unsupportedRecipes:new Map(),token:null,continuousCraftSupported:false,choiceWispSupported:false,protectedCountsSupported:false,exactPlanSupported:false,itemRequirementsSupported:false,readableItemRawcodes:new Set(),recipeConditionsSupported:false,specialRecipeConditionsSupported:false,readableConditionTypes:new Set()};
  }
  craftCapabilityRevision++;
  executionPlanCache.clear();
  const available = craftCapabilities.enabled && Boolean(craftCapabilities.token);
  byId("craft-availability").textContent = available ? "" : "게임 조합 준비 중";
  byId("craft-availability").hidden = available;
  renderBoard();
}

async function focusGameFromDesktop(requestId) {
  const bridge = window.chrome?.webview;
  if (!bridge) return;
  if (!Number.isInteger(latestSnapshot?.processId)) throw new Error("게임 연결을 확인해 주세요.");
  return new Promise((resolve,reject) => {
    let timer;
    const finished = event => {
      const result = event.data;
      if (!result || result.type !== "game-focus-result" || result.requestId !== requestId) return;
      clearTimeout(timer);
      bridge.removeEventListener("message",finished);
      if (result.ok === true) resolve();
      else reject(new Error(typeof result.message === "string" ? result.message : "게임 창으로 전환하지 못했습니다."));
    };
    bridge.addEventListener("message",finished);
    timer = setTimeout(() => {
      bridge.removeEventListener("message",finished);
      reject(new Error("게임 창으로 전환하지 못했습니다."));
    },3000);
    try { bridge.postMessage({type:"focus-game",requestId,processId:latestSnapshot.processId}); }
    catch (error) {
      clearTimeout(timer);
      bridge.removeEventListener("message",finished);
      reject(error);
    }
  });
}

function returnToDesktop(requestId,outcome) {
  if (!["succeeded","stopped","failed","unsupported","timeout","focus-failed"].includes(outcome)) return;
  try { window.chrome?.webview?.postMessage({type:"craft-finished",requestId,outcome}); }
  catch { }
}

async function requestGameCraft(recipe,craftOptions={}) {
  updateAnalysisCache();
  const reason = craftDisabledReason(recipe,craftOptions.plan);
  if (reason) { toast(reason); return; }
  const clicked={sequence:latestSnapshot?.sequence,sessionIdentity:latestSnapshot?.sessionIdentity,
    processId:latestSnapshot?.processId,loadedMapHash:latestSnapshot?.loadedMapHash,localPlayer:latestSnapshot?.localPlayer};
  if(typeof clicked.sessionIdentity!=="string"||!/^[A-Fa-f0-9]{8}:[A-Fa-f0-9]{8}:[A-Fa-f0-9]{8}$/.test(clicked.sessionIdentity)){
    craftFeedback("게임 정보를 다시 확인해 주세요.","error");return;
  }
  const plan=craftOptions.plan||executionPlanFor(recipe);
  const stepCount=Number.isSafeInteger(plan?.stepCount)&&plan.stepCount>0?plan.stepCount:1;
  const adaptive=craftCapabilities.adaptiveCraftSupported===true;
  let requestId;
  try { requestId = crypto.randomUUID(); }
  catch { craftFeedback("게임 조합을 시작하지 못했어요.","error"); return; }
  crafting = {requestId,recipeId:String(recipe.id),resultRawcode:recipe.resultUnitRawcode,expectedResults:[...new Set((plan?.steps||[]).map(step=>step.resultRawcode).filter(Boolean))],stepCount,adaptive,submitted:false};
  craftFeedback(stepCount>1?numberFormat.format(stepCount)+"단계 조합 중":nameOf(recipe.resultUnitRawcode)+" 조합 중","waiting");
  renderBoard();
  try { await focusGameFromDesktop(requestId); }
  catch (error) {
    if(crafting?.requestId===requestId&&crafting.stopRequested){crafting=null;craftFeedback("조합을 중지했습니다.","waiting");renderBoard();returnToDesktop(requestId,"stopped");return;}
    crafting = null;
    craftFeedback(error.message || "게임 창으로 전환하지 못했습니다.","error");
    renderBoard();
    returnToDesktop(requestId,"focus-failed");
    return;
  }
  if(crafting?.requestId===requestId&&crafting.stopRequested){crafting=null;craftFeedback("조합을 중지했습니다.","waiting");renderBoard();returnToDesktop(requestId,"stopped");return;}
  if(clicked.sessionIdentity!==latestSnapshot?.sessionIdentity||clicked.processId!==latestSnapshot?.processId||
    clicked.loadedMapHash!==latestSnapshot?.loadedMapHash||clicked.localPlayer!==latestSnapshot?.localPlayer){
    crafting=null;craftFeedback("게임이 바뀌어 조합하지 않았습니다.","error");renderBoard();returnToDesktop(requestId,"failed");return;
  }
  const started = Date.now();
  function accept(result) {
    if (!result || (result.requestId && result.requestId !== requestId)) return false;
    if (result.status === "succeeded") {
      craftFeedback(nameOf(recipe.resultUnitRawcode) + " 조합 완료","success");
      crafting = null;
      renderBoard();
      returnToDesktop(requestId,"succeeded");
      return true;
    }
    if(result.status==="stopped"){
      craftFeedback(typeof result.message==="string"?result.message.slice(0,180):"조합을 중지했습니다.","waiting");
      crafting=null;renderBoard();returnToDesktop(requestId,"stopped");return true;
    }
    if (result.status === "failed" || result.status === "unsupported") {
      const message = typeof result.message === "string" && result.message.trim() ? result.message.trim().slice(0,180) : result.status === "unsupported" ? "이 조합은 아직 지원하지 않아요." : "조합하지 못했어요.";
      craftFeedback(message,"error");
      crafting = null;
      renderBoard();
      returnToDesktop(requestId,result.status);
      return true;
    }
    if ((result.status === "queued" || result.status === "running") && crafting?.requestId === requestId) {
      const completed=result.completedSteps,total=result.totalSteps;
      if (Number.isSafeInteger(completed) && Number.isSafeInteger(total) && total>0 && completed>=0 && completed<=total) {
        crafting.completedSteps=completed;
        crafting.totalSteps=total;
        craftFeedback("조합 중 · "+numberFormat.format(completed)+"/"+numberFormat.format(total)+"단계 완료","waiting");
      }
    }
    return false;
  }
  try {
    if(crafting?.requestId===requestId)crafting.submitted=true;
    const response = await fetch("/api/craft",{
      method:"POST",headers:{"Content-Type":"application/json","X-Craft-Token":craftCapabilities.token},
      body:JSON.stringify({recipeId:String(recipe.id),requestId,snapshotSequence:clicked.sequence,expectedSessionIdentity:clicked.sessionIdentity,adaptive,
        ...(craftOptions.protectedCounts?{protectedCounts:craftOptions.protectedCounts}:{}),
        ...(craftOptions.expectedSteps?{expectedSteps:craftOptions.expectedSteps}:{})}),
      signal:AbortSignal.timeout(5000)
    });
    const result = await response.json();
    if (accept(result)) return;
  } catch {
    // 요청 도착 여부가 불명확하면 다시 전송하지 않고 같은 요청의 결과만 조회한다.
  }
  const waitBudget=Math.max(30000,((adaptive?64:stepCount)+1)*60000);
  while (Date.now() - started < waitBudget && crafting?.requestId === requestId) {
    await new Promise(resolve => setTimeout(resolve,400));
    try {
      const response = await fetch("/api/craft/" + encodeURIComponent(requestId),{cache:"no-store",signal:AbortSignal.timeout(2000)});
      if (!response.ok) continue;
      if (accept(await response.json())) return;
    } catch { }
  }
  if (crafting?.requestId === requestId) {
    // 결과가 불명확한 요청의 중복 실행을 막기 위해 조합 버튼은 잠긴 채로 둔다.
    craftFeedback("조합 결과를 확인하지 못했어요. 게임에서 결과를 확인해 주세요.","error");
    renderBoard();
    returnToDesktop(requestId,"timeout");
  }
}

async function loadCatalog(){
  try{
    const [response,metadata,descriptions]=await Promise.all([fetch("/data/map-catalog.json",{cache:"no-store"}),fetch("/data/combat-metadata.json",{cache:"no-store"}).then(result=>result.ok?result.json():null).catch(()=>null),fetchNativeUnitDescriptions()]);
    if(!response.ok)throw new Error("catalog unavailable");const data=await response.json();
    if(!Array.isArray(data.units)||!Array.isArray(data.tiers)||!Array.isArray(data.recipes))throw new Error("invalid catalog");
    catalog=data;combatMetadata=metadata&&metadata.units&&Array.isArray(metadata.groups)?metadata:null;nativeUnitDescriptions=descriptions;
    const wispSettings=combatMetadata?.wispMetadata;
    recipeGraph=window.OrdRecipeGraph?.create(data,{choiceWispRawcode:wispSettings?.commonChoiceRawcode||"e018",...(wispSettings?.verified&&Array.isArray(wispSettings.replacements)?{choiceEligibleRawcodes:wispSettings.replacements}:{})})||null;
    startingEvolutionForecast=window.OrdStartingEvolutionForecast?.create(data,{recipeGraph})||null;
    const assignments=new Map();let order=0;
    for(const tier of data.tiers){const normalized=normalizeTier(tier.label||tier.id),label=cleanName(tier.label||tier.id);if(tierSettings.has(normalized)&&label)tierSettings.get(normalized).label=normalized==="special"?"특별함":normalized==="rare"?"희귀함":label;for(const code of tier.unitRawcodes||[])assignments.set(code,{tier:normalized,order:order++});}
    const tierIds=new Map(data.tiers.map(tier=>[String(tier.id),normalizeTier(tier.label||tier.id)]));
    for(const source of data.units){
      const assigned=assignments.get(source.rawcode),meta=combatMetadata?.units?.[source.rawcode];
      const unit={...source,displayName:cleanName(source.displayName||source.properName||source.name),tier:assigned?.tier||tierIds.get(String(source.tier))||normalizeTier(source.tier),order:assigned?.order??order++,meta:meta?.sourceVerified===true?meta:null};
      // 2.323 원문에서 확인된 일시 소환체·분신·스킬 효과는 보유 목록에서 제외한다.
      unit.visible=(source.playable===true||["e0IX","e018"].includes(source.rawcode))&&!["h076","h04T","h04Y","h05D","h0CA","h06O"].includes(source.rawcode)&&!/소환/.test(source.displayName||source.name||"");unitByCode.set(unit.rawcode,unit);
      if(unit.visible){if(!unitsByTier.has(unit.tier))unitsByTier.set(unit.tier,[]);unitsByTier.get(unit.tier).push(unit);}
    }
    for(const recipe of data.recipes){if(!recipesByUnit.has(recipe.resultUnitRawcode))recipesByUnit.set(recipe.resultUnitRawcode,[]);recipesByUnit.get(recipe.resultUnitRawcode).push(recipe);}
    byId("map-caption").textContent=cleanName(data.map?.title)||"원피스 랜덤 디펜스";byId("catalog-state").hidden=true;buildBoard();
    void loadStoryRankings();
    if(latestSnapshot)applySnapshot(latestSnapshot);else renderBoard();
  }catch{catalogError=true;byId("catalog-state").textContent="유닛 정보를 불러오지 못했어요.";byId("map-caption").textContent="";updateStatus();}
}

function toast(message) {
  if (toastTimer) clearTimeout(toastTimer);
  byId("toast").textContent = message;
  byId("toast").hidden = false;
  toastTimer = setTimeout(() => { byId("toast").hidden = true; },2500);
}

(async()=>{const revision=receivedRevision;try{const response=await fetch("/api/snapshot",{cache:"no-store"});if(!response.ok)return;const payload=await response.json();if(revision===receivedRevision)applySnapshot(payload);}catch{}})();
